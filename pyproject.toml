[project]
name = "qsc-experiments"
version = "1.0.0"
description = "Reproducible experiments for the QSC post-quantum multi-agent security framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "requests>=2.31.0",
    "liboqs-python>=0.12.0,<0.15.0",
    "PyNaCl>=1.5.0",
    "cryptography>=42.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
