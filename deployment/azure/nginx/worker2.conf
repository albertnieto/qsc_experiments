worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;


events {
    worker_connections 1024;
}

http {
    include /opt/nginx/conf/mime.types;

    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;


    sendfile on;
    keepalive_timeout 65;

    # PQC-TLS enabled server
    server {
        listen 8443 ssl;

        server_name worker2;

        # TLS configuration with PQC support
        ssl_certificate /etc/nginx/certs/worker.crt;
        ssl_certificate_key /etc/nginx/certs/worker.key;
        
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        
        # Hybrid PQC Key Exchange Methods (KEMs)
        ssl_ecdh_curve X25519MLKEM768:x25519;



        
        # Modern cipher suites
        # ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
        ssl_ciphers HIGH:!aNULL:!MD5;

        
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # Proxy to worker agent (Localhost in Sidecar)
        location / {
            proxy_pass http://localhost:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
